# Helm values for the official Qdrant chart (repo: https://qdrant.github.io/qdrant-helm)
replicaCount: 1

persistence:
  storageClassName: local-path
  size: 10Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 3Gi

# Ingress is defined in manifests/50-ingress.yaml (host qdrant.<PI_IP>.nip.io)
