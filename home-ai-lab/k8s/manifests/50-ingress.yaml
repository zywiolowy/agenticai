# Traefik (built into k3s) exposes the UIs/APIs on port 80 of the Pi.
# nip.io is a free wildcard DNS: webui.192.168.1.20.nip.io resolves to 192.168.1.20,
# so you get nice hostnames without editing DNS or /etc/hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-lab
  namespace: ai-lab
spec:
  ingressClassName: traefik
  rules:
    - host: webui.${PI_IP}.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: open-webui, port: {number: 8080}}
    - host: litellm.${PI_IP}.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: litellm, port: {number: 4000}}
    - host: qdrant.${PI_IP}.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: qdrant, port: {number: 6333}}
